name: Collect primary LinkedIn slice
on:
  workflow_call:
    inputs:
      slice:
        type: string
        required: true
      bounds:
        type: string
        required: true
      prior_guard:
        type: string
        default: '{}'
    outputs:
      guard:
        value: ${{ jobs.collect.outputs.guard }}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 165 || 85 }}
    outputs:
      guard: ${{ steps.collect.outputs.guard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - id: collect
        env:
          BOUNDS: ${{ inputs.bounds }}
          SHARD: shard-${{ inputs.slice }}.json
          LINKEDIN_PRIOR_GUARD: ${{ inputs.prior_guard != '{}' && inputs.prior_guard || '' }}
          LINKEDIN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '120' || '40' }}
        run: |
          read -r e0 e1 s0 s1 <<< "$BOUNDS"
          python -m scanner.pipeline --employer-start "$e0" --employer-end "$e1" --skill-start "$s0" --skill-end "$s1" --linkedin-shard-out "$SHARD"
          echo "guard=$(jq -c .guard "$SHARD")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-${{ inputs.slice }}
          path: shard-${{ inputs.slice }}.json
          if-no-files-found: error
          retention-days: 1
name: Publish dashboard

# Runs when code, config or the site changes. It never searches for jobs:
# it re-applies the scoring config to the stored results and republishes.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config/**"
      - "scanner/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
      - "!site/data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crjs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Re-apply scoring and config (no network)
        run: python -m scanner.pipeline --rescore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

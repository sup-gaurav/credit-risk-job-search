name: Credit risk job scan

# Three ways in, one scan:
#   schedule           every 4 hours at 00:30, 04:30, 08:30, 12:30, 16:30 and 20:30 UTC
#   workflow_dispatch  "Run workflow" on GitHub, or the dashboard Refresh button with a saved token
#   issues             the dashboard's "Open scan request" link; only the repository owner's request runs
on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: crjs-publish
  cancel-in-progress: false

jobs:
  shard1:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[SCAN]'))
    uses: ./.github/workflows/linkedin-shard.yml
    with:
      slice: '1'
      bounds: '0 50 0 6'
  shard2:
    needs: shard1
    uses: ./.github/workflows/linkedin-shard.yml
    with:
      slice: '2'
      bounds: '50 100 6 12'
      prior_guard: ${{ needs.shard1.outputs.guard }}
  shard3:
    needs: shard2
    uses: ./.github/workflows/linkedin-shard.yml
    with:
      slice: '3'
      bounds: '100 150 12 18'
      prior_guard: ${{ needs.shard2.outputs.guard }}
  shard4:
    needs: shard3
    uses: ./.github/workflows/linkedin-shard.yml
    with:
      slice: '4'
      bounds: '150 200 18 23'
      prior_guard: ${{ needs.shard3.outputs.guard }}
  scan:
    needs: [shard1, shard2, shard3, shard4]
    if: >-
      always() && !cancelled() && (github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[SCAN]')))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 165 || 85 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest discover -s tests

      - name: Acknowledge dashboard request
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Scan started. Progress: $RUN_URL"

      - uses: actions/download-artifact@v4
        with:
          pattern: linkedin-*
          path: linkedin-shards
          merge-multiple: true

      - name: Aggregate primary searches and finish scan
        env:
          LINKEDIN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '120' || '40' }}
          SCAN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'issues' && 'dashboard request' || 'manual' }}
        run: python -m scanner.pipeline --linkedin-shards-in 'linkedin-shards/*.json'

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Scan results $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Daily top-10 alert
        # GitHub emails the owner about the new issue: the free replacement for an SMTP alert.
        # Turn off with repository variable DIGEST_ISSUE=off.
        if: github.event_name == 'schedule' && vars.DIGEST_ISSUE != 'off'
        run: |
          gh label create digest --repo "$GITHUB_REPOSITORY" --color 0d5c4a --description "Daily top-10 alert" --force
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          done
          {
            cat site/data/digest.md
            echo
            echo "Dashboard: ${{ steps.deploy.outputs.page_url }}"
            echo
            echo "@${{ github.repository_owner }}"
          } > /tmp/digest.md
          gh issue create --repo "$GITHUB_REPOSITORY" --label digest \
            --title "Top credit risk roles · $(TZ=Asia/Kolkata date '+%d %b %Y')" --body-file /tmp/digest.md

      - name: Close dashboard request
        if: github.event_name == 'issues'
        run: |
          {
            echo "Scan finished and the dashboard is updated: ${{ steps.deploy.outputs.page_url }}"
            echo
            cat site/data/digest.md
          } > /tmp/done.md
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "$(cat /tmp/done.md)"

      - name: Report a failed request
        if: failure() && github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The scan failed. Log: $RUN_URL"
